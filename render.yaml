services:
  # ---------------------------------------------------------------- API
  - type: web
    name: salt-and-story-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /srv/data
      # The static site URL, exactly (no trailing slash). Set after the web service deploys.
      - key: CORS_ORIGINS
        sync: false
      # Secrets: set in the Render dashboard, never in this file.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      # Non-secret model settings (Gemma 4 on the Gemini API free tier).
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemma-4-26b-a4b-it
      - key: LLM_TIMEOUT
        value: "240"
      - key: LLM_MAX_RPM
        value: "10"
      - key: LLM_MAX_WAIT
        value: "45"
      - key: LLM_THINKING_LEVEL
        value: minimal
      - key: LLM_MAX_PER_DAY
        value: "300"
      - key: SUBMIT_LIMIT
        value: "8"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PHOTO_MB
        value: "10"
    # Free instances have an ephemeral filesystem: recipes, audio and photos are
    # lost on restart or redeploy. On a paid plan, uncomment to keep them.
    # disk:
    #   name: salt-data
    #   mountPath: /srv/data
    #   sizeGB: 1

  # ---------------------------------------------------------------- Web
  - type: web
    name: salt-and-story-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Backend public URL, no trailing slash. Baked in at build time; not a secret.
      - key: VITE_API_URL
        value: https://salt-and-story-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(self)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # If the API URL changes, update connect-src, img-src and media-src too.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://salt-and-story-api.onrender.com; media-src 'self' blob: https://salt-and-story-api.onrender.com; connect-src 'self' https://salt-and-story-api.onrender.com; font-src 'self' data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=2592000
