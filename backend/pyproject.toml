[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI's File()/Form() defaults are the documented idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `pytest` (not only `python -m pytest`) import the app package, as CI runs it.
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/prompts.py" = ["E501"]  # prompt text reads better unwrapped

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
