[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI's File()/Form() defaults are the documented idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/prompts.py" = ["E501"]  # prompt text reads better unwrapped
