# Pull request hygiene: a readable title and no newly vulnerable dependencies.
# The code itself is checked by ci.yml and codeql.yml on the same pull request.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: "Title looks like: feat(scope): short summary"
        env:
          TITLE: ${{ github.event.pull_request.title }}   # passed as data, never interpolated into the script
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{3,72}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must look like 'feat(book): add a dedication page' (got: $TITLE)"
            exit 1
          fi

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
