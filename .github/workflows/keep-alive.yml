# Pings the free Render backend so it is less likely to be asleep during the challenge demo.
# GitHub may delay or skip scheduled runs, and disables scheduled workflows in repos with
# no activity for 60 days. For something sturdier, add an external monitor (see README).
name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "BACKEND_URL is not set"; exit 1; }
          curl -fsS --retry 3 --max-time 60 "$BACKEND_URL/health"
